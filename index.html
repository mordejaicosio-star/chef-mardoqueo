<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cocinando junto al Chef Mardoqueo</title>
<meta name="theme-color" content="#C0651B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chef Mardoqueo">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono.jpg">
<link rel="icon" type="image/jpeg" href="icono.jpg">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#FAF3E1;
    font-family:system-ui,-apple-system,sans-serif;color:#9E4E0F;}
  .caja{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;}
  img{width:140px;height:140px;border-radius:30px;box-shadow:0 10px 30px rgba(154,94,31,.28);margin-bottom:22px;}
  h1{font-size:1.4rem;margin:0 0 6px;color:#9E4E0F;}
  p{font-size:.95rem;opacity:.75;margin:0 0 26px;max-width:320px;line-height:1.5;}
  .btn{background:#C0651B;color:#fff;border:none;border-radius:999px;
    padding:16px 40px;font-size:1.1rem;font-weight:700;cursor:pointer;text-decoration:none;
    box-shadow:0 6px 18px rgba(192,101,27,.35);}
  .btn:active{transform:translateY(1px);}
</style>
</head>
<body>
  <div class="caja">
    <img src="icono.jpg" alt="Chef Mardoqueo">
    <h1>Cocinando junto al Chef Mardoqueo</h1>
    <p>Recetas, menús y el catálogo premium de la Chef Ilanita ✨</p>
    <a class="btn" href="https://script.google.com/macros/s/AKfycbw11Kl9oA8h35N4WVFrbGW1vLpLm6ZGzgRpTwKfCfvLDP3QdxfoeO49_l-oFd8xV1k0/exec?modo=publico">Entrar a la cocina 🍳</a>
  </div>
  <script>
    // Si la app ya está INSTALADA (se abre en modo app), entra directo sin mostrar el botón.
    (function(){
      var esApp = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      if (esApp) { window.location.replace("https://script.google.com/macros/s/AKfycbw11Kl9oA8h35N4WVFrbGW1vLpLm6ZGzgRpTwKfCfvLDP3QdxfoeO49_l-oFd8xV1k0/exec?modo=publico"); }
    })();
  </script>
</body>
</html>
